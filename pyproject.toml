[project]
name = "local-survey-research-filter"
version = "0.1.0"
description = "Local-first literature survey tool"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "django>=5.0,<6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-django>=4.8"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.autopep8]
max_line_length = 79
indent_size = 4
aggressive = 0
