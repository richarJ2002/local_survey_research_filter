<form method="get" class="chart-controls" aria-label="{{ chart.title }} settings">
  {% for name, value in chart.preserved.items %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
  {% for control in chart.controls %}
  <label for="{{ chart.kind }}-{{ control.name }}">
    {% if control.name == 'prune' %}<input id="{{ chart.kind }}-{{ control.name }}" type="checkbox" name="prune"{% if control.value == 'on' %} checked{% endif %}> {{ control.label }}
    {% else %}{{ control.label }}
      {% if control.menu %}<select id="{{ chart.kind }}-{{ control.name }}" name="{{ control.name }}">{% for choice in control.menu %}<option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}>{{ choice.label }}</option>{% endfor %}</select>
      {% else %}<input id="{{ chart.kind }}-{{ control.name }}" type="number" name="{{ control.name }}" min="{{ control.minimum }}"{% if control.maximum != '' %} max="{{ control.maximum }}"{% endif %} value="{{ control.value|default_if_none:'' }}">{% endif %}
    {% endif %}
  </label>
  {% endfor %}
  <button type="submit">Update chart</button>
</form>
